services:
  postgres:
    image: ankane/pgvector:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: canproject
    ports:
      - "5432:5432"
    volumes:
      - canproject_pg_data:/var/lib/postgresql/data

volumes:
  canproject_pg_data:
